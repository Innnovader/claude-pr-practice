name: Scraper de noticias — Radar Liberal DNL

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/scraper/requirements.txt

      - name: Instalar dependencias
        working-directory: services/scraper
        run: pip install -r requirements.txt

      - name: Correr tests (dedup, filtro de relevancia)
        working-directory: services/scraper
        run: python -m pytest tests/ -q

      - name: Correr ciclo de noticias + centros de pensamiento
        working-directory: services/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_scheduled.py
